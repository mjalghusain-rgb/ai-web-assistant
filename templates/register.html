<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>

        Register

    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:Arial,sans-serif;

            background:#020617;

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;

            color:white;
        }

        .auth-box{

            width:520px;

            background:#071029;

            padding:60px;

            border-radius:40px;

            border:1px solid #1e293b;
        }

        .logo{

            text-align:center;

            margin-bottom:40px;

            font-size:30px;

            color:#38bdf8;

            font-weight:bold;
        }

        h1{

            text-align:center;

            margin-bottom:20px;

            font-size:64px;
        }

        .subtitle{

            text-align:center;

            color:#94a3b8;

            margin-bottom:50px;

            font-size:22px;
        }

        form{

            display:flex;

            flex-direction:column;

            gap:28px;
        }

        input{

            background:#1e293b;

            border:none;

            padding:24px;

            border-radius:22px;

            color:white;

            font-size:22px;
        }

        button{

            background:#38bdf8;

            border:none;

            padding:24px;

            border-radius:22px;

            font-size:24px;

            font-weight:bold;

            cursor:pointer;
        }

        .bottom-text{

            text-align:center;

            margin-top:35px;

            font-size:20px;
        }

        .bottom-text a{

            color:#38bdf8;

            text-decoration:none;

            font-weight:bold;
        }

    </style>

</head>

<body>



<div class="auth-box">

    <div class="logo">

        🤖 DevOps AI

    </div>



    <h1>

        Create Account

    </h1>



    <div class="subtitle">

        Start your AI Workspace journey

    </div>



    <form
    method="POST"
    action="/register">



        <input
        type="text"
        name="username"
        placeholder="Username"
        required>



        <input
        type="email"
        name="email"
        placeholder="Email"
        required>



        <input
        type="password"
        name="password"
        placeholder="Password"
        required>



        <button type="submit">

            Register

        </button>

    </form>



    <div class="bottom-text">

        Already have an account?

        <a href="/login">

            Login

        </a>

    </div>

</div>

</body>
</html>
