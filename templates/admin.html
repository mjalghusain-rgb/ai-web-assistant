<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>

        Admin Dashboard

    </title>

    <style>

        body{

            background:#020617;

            color:white;

            font-family:Arial;

            padding:40px;
        }

        h1{

            margin-bottom:40px;
        }

        .stats{

            display:flex;

            gap:30px;

            margin-bottom:50px;
        }

        .card{

            background:#071029;

            padding:30px;

            border-radius:20px;

            min-width:220px;
        }

        .card h2{

            color:#38bdf8;
        }

        .user-card{

            background:#071029;

            padding:25px;

            border-radius:20px;

            margin-bottom:20px;
        }

        .delete-btn{

            display:inline-block;

            margin-top:15px;

            background:red;

            color:white;

            padding:10px 20px;

            border-radius:10px;

            text-decoration:none;
        }

        .back-btn{

            display:inline-block;

            margin-top:40px;

            color:#38bdf8;

            text-decoration:none;
        }

    </style>

</head>

<body>



<h1>

    👑 Admin Dashboard

</h1>



<div class="stats">

    <div class="card">

        <h2>

            Total Users

        </h2>

        <h1>

            {{ users|length }}

        </h1>

    </div>



    <div class="card">

        <h2>

            Total Chats

        </h2>

        <h1>

            124

        </h1>

    </div>

</div>





<h1>

    Latest Users

</h1>



{% for user in users %}

<div class="user-card">

    <h2>

        {{ user.username }}

    </h2>

    <p>

        {{ user.email }}

    </p>



    <p>

        Admin:
        {{ user.is_admin }}

    </p>



    <a
    class="delete-btn"
    href="/delete-user/{{ user.id }}">

        Delete User

    </a>

</div>

{% endfor %}





<a
class="back-btn"
href="/dashboard">

    ← Back to Platform

</a>

</body>
</html>
