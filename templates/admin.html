<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet"
    href="/static/style.css">

</head>

<body>

<div class="main-content">

    <h1>
        👑 Admin Dashboard
    </h1>

    <br>

    <div class="tools-row">

        <div class="tool-card">

            <h2>
                Total Users
            </h2>

            <h1>
                {{ total_users }}
            </h1>

        </div>

        <div class="tool-card">

            <h2>
                Total Chats
            </h2>

            <h1>
                {{ total_chats }}
            </h1>

        </div>

    </div>

    <br>

    <div class="tool-card">

        <h2>
            Latest Users
        </h2>

        <br>

        {% for user in latest_users %}

            <p>

                👤 {{ user.username }}

                —
                {{ user.email }}

            </p>

            <br>

        {% endfor %}

    </div>

    <br>

    <a href="/">

        ← Back to Platform

    </a>

</div>

</body>
</html>
