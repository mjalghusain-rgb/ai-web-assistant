<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>

        Profile - DevOps AI

    </title>

    <link rel="stylesheet"
    href="/static/style.css">

</head>

<body>

<div class="dashboard-layout">



    <!-- SIDEBAR -->

    <div class="left-sidebar">

        <h3>

            👤 User Menu

        </h3>

        <a href="/dashboard"
        class="saved-item">

            Dashboard

        </a>

        <a href="/documents"
        class="saved-item">

            Documents

        </a>

        <a href="/tools"
        class="saved-item">

            AI Tools

        </a>

        <a href="/agents"
        class="saved-item">

            AI Agents

        </a>

        <a href="/roadmap"
        class="saved-item">

            Roadmap

        </a>

        <a href="/logout"
        class="saved-item">

            Logout

        </a>

    </div>



    <!-- CONTENT -->

    <div class="dashboard-content">



        <div class="stats-card">

            <h2>

                👤 Profile Information

            </h2>

            <br>



            <!-- PROFILE IMAGE -->

            <div style="text-align:center;">



                {% if user.profile_image != "default.png" %}

                    <img
                    src="/uploads/{{ user.profile_image }}"
                    style="
                    width:140px;
                    height:140px;
                    border-radius:50%;
                    object-fit:cover;
                    border:4px solid #38bdf8;
                    margin-bottom:20px;">

                {% else %}

                    <div style="
                    width:140px;
                    height:140px;
                    border-radius:50%;
                    background:#1e293b;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:60px;
                    margin:auto;
                    margin-bottom:20px;">

                        👤

                    </div>

                {% endif %}



            </div>



            <!-- PROFILE FORM -->

            <form
            method="POST"
            enctype="multipart/form-data">



                <label>

                    Upload Profile Image

                </label>

                <br><br>

                <input
                type="file"
                name="profile_image">

                <br><br>



                <input
                type="text"
                name="username"
                value="{{ user.username }}"
                placeholder="Username">

                <br><br>



                <input
                type="email"
                name="email"
                value="{{ user.email }}"
                placeholder="Email">

                <br><br>



                <input
                type="text"
                name="job_title"
                value="{{ user.job_title }}"
                placeholder="Job Title">

                <br><br>



                <input
                type="text"
                name="country"
                value="{{ user.country }}"
                placeholder="Country">

                <br><br>



                <input
                type="text"
                name="experience_level"
                value="{{ user.experience_level }}"
                placeholder="Experience Level">

                <br><br>



                <textarea
                name="bio"
                style="
                width:100%;
                height:120px;
                padding:16px;
                border-radius:16px;
                background:#1e293b;
                color:white;
                border:none;">{{ user.bio }}</textarea>

                <br><br>



                <textarea
                name="skills"
                style="
                width:100%;
                height:120px;
                padding:16px;
                border-radius:16px;
                background:#1e293b;
                color:white;
                border:none;">{{ user.skills }}</textarea>

                <br><br>



                <button
                type="submit"
                class="new-chat-btn">

                    Save Profile

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
