<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>

        Profile - DevOps AI

    </title>

    <link rel="stylesheet"
    href="/static/style.css">

</head>

<body>

<div class="dashboard-layout">



    <!-- SIDEBAR -->

    <div class="left-sidebar">

        <h3>

            👤 User Menu

        </h3>

        <div class="saved-item">

            Dashboard

        </div>

        <div class="saved-item">

            Documents

        </div>

        <div class="saved-item">

            Notifications

        </div>

        <div class="saved-item">

            Settings

        </div>

        <div class="saved-item">

            Logout

        </div>

    </div>



    <!-- CONTENT -->

    <div class="dashboard-content">



        <div class="stats-card">

            <h2>

                👤 Profile Information

            </h2>

            <br>



            <form method="POST">



                <input
                type="text"
                name="username"
                value="{{ user.username }}"
                placeholder="Username">

                <br><br>



                <input
                type="email"
                name="email"
                value="{{ user.email }}"
                placeholder="Email">

                <br><br>



                <input
                type="text"
                name="job_title"
                value="{{ user.job_title }}"
                placeholder="Job Title">

                <br><br>



                <input
                type="text"
                name="country"
                value="{{ user.country }}"
                placeholder="Country">

                <br><br>



                <input
                type="text"
                name="experience_level"
                value="{{ user.experience_level }}"
                placeholder="Experience Level">

                <br><br>



                <textarea
                name="bio"
                placeholder="Bio"
                style="width:100%;height:120px;padding:16px;border-radius:16px;background:#1e293b;color:white;border:none;">{{ user.bio }}</textarea>

                <br><br>



                <textarea
                name="skills"
                placeholder="Skills"
                style="width:100%;height:120px;padding:16px;border-radius:16px;background:#1e293b;color:white;border:none;">{{ user.skills }}</textarea>

                <br><br>



                <button
                type="submit"
                class="new-chat-btn">

                    Save Profile

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
